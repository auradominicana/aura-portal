<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Aura</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0D2054;--navy2:#162B6E;--teal:#00B5A3;--teal2:#00D4C0;--orange:#F4891F;--red:#E03131;--green:#2F9E44;--bg:#F4F6FA;--text:#182645;--muted:#8A97AE}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  header{background:linear-gradient(155deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:0;position:relative;overflow:hidden}
  header::before{content:'';position:absolute;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(0,181,163,.22) 0%,transparent 70%);top:-200px;right:-80px}
  .header-inner{position:relative;max-width:1080px;margin:0 auto;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
  header .logo img{height:26px;display:block}
  header .who{display:flex;align-items:center;gap:14px;font-size:13px}
  header .who .name{font-weight:700}
  header button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;padding:8px 14px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:700;font-family:inherit;transition:background .15s}
  header button:hover{background:rgba(255,255,255,.2)}

  .greeting-band{position:relative;max-width:1080px;margin:0 auto;padding:26px 28px 30px}
  .greeting-band h1{margin:0 0 6px;font-size:24px;font-weight:800}
  .greeting-band .msg{font-size:13.5px;color:rgba(255,255,255,.82);font-weight:500;max-width:560px;line-height:1.5}

  main{max-width:1080px;margin:0 auto;padding:32px 24px 60px}
  h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:0 0 16px;font-weight:800}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-bottom:40px}
  .card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 2px 10px rgba(13,32,84,.07);cursor:pointer;transition:transform .15s,box-shadow .15s;border:1px solid #EEF1F6}
  .card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(13,32,84,.14)}
  .card .icn{font-size:32px;margin-bottom:10px}
  .card h3{margin:0 0 6px;font-size:16.5px;color:var(--navy);font-weight:800}
  .card p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}
  .card .go{margin-top:14px;font-size:12px;font-weight:800;color:var(--teal)}

  .score-wrap{background:#fff;border-radius:16px;padding:24px 26px;box-shadow:0 2px 10px rgba(13,32,84,.07);display:flex;align-items:center;gap:26px;flex-wrap:wrap;border:1px solid #EEF1F6}
  .score-circle{position:relative;width:96px;height:96px;flex-shrink:0}
  .score-circle svg{transform:rotate(-90deg)}
  .score-circle .bg{fill:none;stroke:#EDF1F7;stroke-width:9}
  .score-circle .fill{fill:none;stroke-width:9;stroke-linecap:round;stroke-dasharray:251.2;transition:stroke-dashoffset .8s ease}
  .score-circle .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .score-circle .num .v{font-size:24px;font-weight:800;font-family:'JetBrains Mono',monospace}
  .score-circle .num .p{font-size:9px;color:var(--muted)}
  .score-info{flex:1;min-width:200px}
  .score-title{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
  .score-label{font-size:17px;font-weight:800;color:var(--navy);margin-bottom:12px}
  .score-bars{display:flex;flex-direction:column;gap:8px}
  .score-bar-row{display:grid;grid-template-columns:130px 1fr 60px;align-items:center;gap:10px;font-size:11.5px}
  .score-bar-row .lbl{color:var(--muted);font-weight:600}
  .score-bar-row .bar{height:6px;background:#EDF1F7;border-radius:999px;overflow:hidden}
  .score-bar-row .fill{height:100%;border-radius:999px}
  .score-bar-row .pct{text-align:right;font-weight:800;color:var(--navy);font-family:'JetBrains Mono',monospace}
  .muted-note{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo"><img src="/logo-aura-white.png" alt="Aura"></div>
    <div class="who">
      <span class="name" id="whoName"></span>
      <button onclick="salir()">Cerrar sesión</button>
    </div>
  </div>
  <div class="greeting-band">
    <h1 id="saludo">Hola</h1>
    <div class="msg" id="mensajeDia"></div>
  </div>
</header>
<main>
  <h2>Score General · Coordinadora Administrativa</h2>
  <div class="score-wrap" id="scoreWrap">
    <div class="score-circle">
      <svg width="96" height="96" viewBox="0 0 96 96">
        <circle class="bg" cx="48" cy="48" r="40"></circle>
        <circle class="fill" id="scGenCircle" cx="48" cy="48" r="40" stroke="#9AAAB4" stroke-dashoffset="251.2"></circle>
      </svg>
      <div class="num"><span class="v" id="scGenVal">—</span><span class="p">/ 100</span></div>
    </div>
    <div class="score-info">
      <div class="score-title">Promedio general</div>
      <div class="score-label" id="scGenLabel">Cargando...</div>
      <div class="score-bars">
        <div class="score-bar-row">
          <span class="lbl">💳 Gestión Contable</span>
          <div class="bar"><div class="fill" id="barContable" style="width:0%;background:#9AAAB4"></div></div>
          <span class="pct" id="pctContable">—</span>
        </div>
        <div class="score-bar-row">
          <span class="lbl">🔧 Gestión Operativa</span>
          <div class="bar"><div class="fill" id="barOperativo" style="width:0%;background:#9AAAB4"></div></div>
          <span class="pct" id="pctOperativo">—</span>
        </div>
      </div>
    </div>
  </div>
  <div class="muted-note" id="scoreNote"></div>

  <h2 style="margin-top:36px">Sistemas</h2>
  <div class="cards" id="cards"></div>
</main>

<script>
const MENSAJES_DIA = [
  '"La calidad no es un acto, es un hábito." — Aristóteles',
  '"Lo que no se mide, no se puede mejorar." — Peter Drucker',
  '"El éxito es la suma de pequeños esfuerzos repetidos día tras día." — Robert Collier',
  '"La disciplina es el puente entre las metas y los logros." — Jim Rohn',
  '"No cuentes los días, haz que los días cuenten." — Muhammad Ali',
  '"El orden y la simplicidad son las claves de la verdadera elegancia." — Coco Chanel',
  '"La excelencia no es un accidente; es el resultado de la intención y el esfuerzo." — Aristóteles',
  '"Hacer las cosas bien cuando nadie está mirando." — C.S. Lewis, sobre el carácter',
  '"El trabajo duro vence al talento cuando el talento no trabaja duro." — Tim Notke',
  '"La forma en que haces algo es la forma en que haces todo." — atribuida a diversos autores',
  '"Un objetivo sin un plan es solo un deseo." — Antoine de Saint-Exupéry',
  '"La paciencia es amarga, pero su fruto es dulce." — Aristóteles',
  '"Cuida los pequeños gastos; un pequeño agujero hunde un barco." — Benjamin Franklin',
  '"Lo que se planea con calma, se ejecuta con firmeza." — proverbio popular',
  '"La simplicidad es la máxima sofisticación." — Leonardo da Vinci',
  '"El liderazgo es hacer que las cosas sucedan a través de otros." — atribuida a diversos autores',
  '"La confianza se construye con pequeñas coherencias, día tras día." — proverbio popular',
  '"No hay viento favorable para el que no sabe a qué puerto se dirige." — Séneca',
  'Lo que se cuida a tiempo, no se convierte en problema. Hoy es un buen día para adelantarte.',
  'Cada cobro al día y cada instalación completada es un cliente que confía más en Aura.',
  'Un buen seguimiento hoy evita una llamada incómoda mañana.',
  'Coordinar bien no siempre se nota, pero siempre se siente.',
  'Lo que no se mide, se olvida. Lo que tú coordinas, no se te escapa.',
  'Cada detalle administrativo bien cerrado es tiempo que el equipo se ahorra después.',
  'Un cliente bien atendido después de la venta es la mejor publicidad que existe.',
  'La organización de hoy es la tranquilidad de mañana.',
  'Lo urgente pasa, lo importante se queda — y tú sabes distinguirlos muy bien.',
];

function saludoHora() {
  const h = new Date().getHours();
  if (h < 12) return 'Buenos días';
  if (h < 19) return 'Buenas tardes';
  return 'Buenas noches';
}
function mensajeDelDia() {
  const hoy = new Date();
  const inicioAnio = new Date(hoy.getFullYear(), 0, 0);
  const diaDelAnio = Math.floor((hoy - inicioAnio) / 86400000);
  return MENSAJES_DIA[diaDelAnio % MENSAJES_DIA.length];
}

async function cargarMe() {
  const r = await fetch('/api/me');
  const d = await r.json();
  if (!d.ok) { location.href = '/login.html'; return; }
  const primerNombre = (d.nombre || '').split(' ')[0];
  document.getElementById('whoName').textContent = d.nombre + ' · Admin';
  document.getElementById('saludo').textContent = `${saludoHora()}, ${primerNombre} 👋`;
  document.getElementById('mensajeDia').textContent = mensajeDelDia();
}

async function cargarSistemas() {
  const r = await fetch('/api/sistemas');
  const sistemas = await r.json();
  const wrap = document.getElementById('cards');
  wrap.innerHTML = sistemas.map(s => `
    <div class="card" onclick="entrar('${s.id}')">
      <div class="icn">${s.icono}</div>
      <h3>${s.nombre}</h3>
      <p>${s.descripcion}</p>
      <div class="go">Entrar →</div>
    </div>
  `).join('');
}

async function entrar(sistema) {
  const r = await fetch('/api/portal/launch', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sistema })
  });
  const d = await r.json();
  if (d.ok) location.href = d.url;
  else alert('No se pudo entrar: ' + (d.error || 'error desconocido'));
}

function colorScore(s) { return s >= 80 ? 'var(--green)' : s >= 60 ? 'var(--orange)' : 'var(--red)'; }
function labelScore(s) { return s >= 80 ? '🟢 Excelente' : s >= 60 ? '🟡 Regular' : '🔴 Requiere atención'; }

async function cargarScore() {
  try {
    const r = await fetch('/api/score-general');
    const d = await r.json();
    const circum = 251.2;

    if (d.general !== null) {
      const color = colorScore(d.general);
      document.getElementById('scGenVal').textContent = d.general;
      document.getElementById('scGenVal').style.color = color;
      document.getElementById('scGenLabel').textContent = labelScore(d.general);
      document.getElementById('scGenLabel').style.color = color;
      const circle = document.getElementById('scGenCircle');
      circle.setAttribute('stroke', color);
      circle.style.strokeDashoffset = circum - (d.general / 100 * circum);
    } else {
      document.getElementById('scGenLabel').textContent = 'Aún sin datos suficientes';
    }

    const setBar = (barId, pctId, s) => {
      const val = s && typeof s.score === 'number' ? s.score : null;
      const bar = document.getElementById(barId), pct = document.getElementById(pctId);
      if (val === null) { pct.textContent = 'Sin datos'; bar.style.width = '0%'; return; }
      bar.style.width = val + '%'; bar.style.background = colorScore(val);
      pct.textContent = val + '%';
    };
    setBar('barContable', 'pctContable', d.contable);
    setBar('barOperativo', 'pctOperativo', d.operativo);

    document.getElementById('scoreNote').textContent =
      'Promedio simple entre el Score de Gestión de Cobros y el Score de Analista Operativo del Rutero. Se actualiza cada vez que alguien abre esos dashboards.';
  } catch (e) {
    document.getElementById('scGenLabel').textContent = 'No se pudo cargar el score';
  }
}

async function salir() {
  await fetch('/api/logout', { method: 'POST' });
  location.href = '/login.html';
}

cargarMe();
cargarSistemas();
cargarScore();
</script>
</body>
</html>
