<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Aura</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0D2054;--navy2:#162B6E;--teal:#00B5A3;--teal2:#00D4C0;--orange:#F4891F;--bg:#F4F6FA}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    background:linear-gradient(155deg,var(--navy) 0%,var(--navy2) 55%,var(--navy) 100%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
  body::before{content:'';position:absolute;width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle,rgba(0,181,163,.25) 0%,transparent 70%);top:-180px;right:-160px}
  body::after{content:'';position:absolute;width:420px;height:420px;border-radius:50%;
    background:radial-gradient(circle,rgba(244,137,31,.12) 0%,transparent 70%);bottom:-160px;left:-140px}
  .card{position:relative;background:#fff;border-radius:20px;padding:40px 34px;width:100%;max-width:370px;box-shadow:0 24px 70px rgba(2,10,40,.4)}
  .logo{display:flex;justify-content:center;margin-bottom:24px}
  .logo img{height:34px}
  h1{font-size:19px;color:var(--navy);text-align:center;margin:0 0 4px;font-weight:800}
  .sub{text-align:center;color:#8A97AE;font-size:12.5px;margin-bottom:28px;font-weight:600;letter-spacing:.2px}
  label{font-size:11px;font-weight:700;color:#8A97AE;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px}
  input{width:100%;padding:12px 13px;border:1.5px solid #E4E9F1;border-radius:10px;font-size:14px;margin-bottom:16px;font-family:inherit;background:#FAFBFD}
  input:focus{outline:none;border-color:var(--teal);background:#fff;box-shadow:0 0 0 3px rgba(0,181,163,.12)}
  button{width:100%;padding:13px;border:none;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;transition:background .15s}
  button:hover{background:var(--navy2)}
  #err{display:none;color:#E03131;font-size:12.5px;text-align:center;margin-top:14px;font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="/logo-aura-color.png" alt="Aura"></div>
    <h1>Portal Aura</h1>
    <div class="sub">Cobros · Operaciones</div>
    <form id="f">
      <label>Correo</label>
      <input id="email" type="email" autocomplete="username" required>
      <label>Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
    <div id="err">Correo o contraseña incorrectos</div>
  </div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('err');
  err.style.display = 'none';
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const d = await r.json();
    if (d.ok) { location.href = '/'; } else { err.style.display = 'block'; }
  } catch (e2) { err.style.display = 'block'; }
});
</script>
</body>
</html>
